<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.:: SHARKS ROBUX STORE ::.</title>
    <!-- CSS Utama -->
    <link rel="stylesheet" href="style.css">
    <!-- Font Plus Jakarta Sans & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Penyesuaian agar logo.png tampil sempurna di dalam lingkaran logo */
        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <!-- HEADER & NAVBAR -->
    <header class="navbar-container">
        <div class="logo-group">
            <div class="logo-icon">
                <img src="logo.png" alt="Logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/50';">
            </div>
            <div class="logo-text">
                <span class="brand-name">Sharks Bobux</span>
                <span class="brand-sub">JAJAN AFFORDABLE</span>
            </div>
        </div>

        <!-- MENU NAVIGASI -->
        <nav class="nav-links">
            <a href="home.html" target="konten" class="nav-btn active">Home</a>
            <a href="product.html" target="konten" class="nav-btn">Product</a>
            <a href="order.html" target="konten" class="nav-btn">Beli Bobux</a>
            <a href="leaderboard.html" target="konten" class="nav-btn">Leaderboard</a>

            <!-- DROPDOWN SOCIALS -->
            <div class="dropdown">
                <button class="dropbtn">Socials <i class="fa-solid fa-chevron-down icon-arrow"></i></button>
                <div class="dropdown-content">
                    <a href="https://www.instagram.com/sharks.bobux_officialstore?xtok=MTJwdnBvb3ZwZnF2NQ%3D%3D&utm_source=qr" target="_blank"><i class="fa-brands fa-instagram"></i> Instagram</a>
                    <a href="https://www.tiktok.com/@sharkz.bobux_official?is_from_webapp=1&sender_device=pc" target="_blank"><i class="fa-brands fa-tiktok"></i> TikTok</a>
                    <a href="https://youtube.com/@itz_sharksbobux?si=PT7zJYfko8tLFKCi" target="_blank"><i class="fa-brands fa-youtube"></i> YouTube</a>
                </div>
            </div>
        </nav>

        <!-- ACTION BUTTONS -->
        <div class="nav-actions">
            <button class="btn-icon" title="Keranjang"><i class="fa-solid fa-cart-shopping"></i></button>
            <a href="login.html" target="konten" class="btn-outline" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">Login</a>
            <a href="register.html" target="konten" class="btn-primary" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">Register</a>
        </div>
    </header>

    <!-- AREA KONTEN (IFRAME) -->
    <main class="content-area">
        <iframe 
            src="home.html" 
            name="konten" 
            id="iframe-konten"
            frameborder="0" 
            width="100%"
            style="min-height: 850px; display: block;"
            onload="resizeIframe(this)">
        </iframe>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 SHARKS ROBUX STORE | Affordable. Easy. Trusted.</p>
    </footer>

    <!-- SCRIPT PENYESUAIAN TINGGI IFRAME & AKTIF TAB -->
    <script>
        function resizeIframe(obj) {
            try {
                if (obj.contentWindow && obj.contentWindow.document) {
                    let doc = obj.contentWindow.document;
                    let height = Math.max(
                        doc.body ? doc.body.scrollHeight : 0,
                        doc.documentElement ? doc.documentElement.scrollHeight : 0
                    );
                    if (height > 0) {
                        obj.style.height = (height + 40) + 'px';
                    }
                }
            } catch (e) {
                console.log("Iframe resize event:", e);
            }
        }

        // Pindah efek aktif pada tombol navigasi saat diklik
        document.querySelectorAll('.nav-links a.nav-btn').forEach(link => {
            link.addEventListener('click', function() {
                document.querySelectorAll('.nav-links a.nav-btn').forEach(a => a.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Hilangkan kelas active di navbar utama jika tombol Login/Register di atas diklik
        document.querySelectorAll('.nav-actions a').forEach(link => {
            link.addEventListener('click', function() {
                document.querySelectorAll('.nav-links a.nav-btn').forEach(a => a.classList.remove('active'));
            });
        });

        // Loop pemeriksaan berkala agar iframe selalu menyesuaikan tinggi konten
        setInterval(function() {
            let iframe = document.getElementById('iframe-konten');
            if (iframe) {
                resizeIframe(iframe);
            }
        }, 500);
    </script>
</body>
</html>
